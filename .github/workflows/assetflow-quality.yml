name: AssetFlow Quality Gate

on:
  pull_request:
    paths:
      - "assetflow/**"
      - ".github/workflows/assetflow-quality.yml"
  push:
    branches:
      - main
    paths:
      - "assetflow/**"
      - ".github/workflows/assetflow-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assetflow-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: assetflow/ai-service
    env:
      DATABASE_URL: postgresql+psycopg://unused:unused@127.0.0.1:5432/unused
      POSTGRES_PASSWORD: unused
      OPENAI_API_KEY: test-key-not-used

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.21"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            assetflow/ai-service/requirements.txt
            assetflow/ai-service/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python \
            -r requirements.txt \
            -r requirements-dev.txt

      - name: Run backend quality gate
        run: .venv/bin/python -m pytest -q

  frontend-quality:
    name: Frontend · lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: assetflow/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assetflow/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build production frontend
        run: npm run build

  docker-stack:
    name: Docker · stack smoke and image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-tests, frontend-quality]
    defaults:
      run:
        working-directory: assetflow/infra
    env:
      POSTGRES_PASSWORD: ci-only-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build images and start the stack
        run: docker compose up -d --build --wait

      - name: Smoke test through the web proxy
        run: |
          curl -fsS http://127.0.0.1:8080/ > /dev/null
          curl -fsS http://127.0.0.1:8080/api/health
          # Read APIs resolve the caller from the database. The CI stack has no seeded users,
          # so a 401 for an unknown user proves proxy -> API -> DB and that auth is enforced.
          status=$(curl -sS -o /dev/null -w "%{http_code}" -H "x-user-id: 999999" "http://127.0.0.1:8080/api/observability/runs?limit=1")
          test "$status" = 401

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100

      - name: Scan images for fixed HIGH and CRITICAL vulnerabilities
        working-directory: assetflow
        run: |
          for image in assetflow-api:local assetflow-web:local; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivyignore:/.trivyignore:ro" \
              aquasec/trivy:0.58.0 image \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile /.trivyignore --exit-code 1 "$image"
          done

      - name: Stop the stack
        if: always()
        run: docker compose down -v
